name: 📊 Generate Profile Contribution Assets

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-contribution-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate GitHub Contribution Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Profile Repository
        uses: actions/checkout@v7.0.1

      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate Synced Contribution Cards
        run: >-
          python .github/scripts/generate_profile_assets.py
          --user "${{ github.repository_owner }}"
          --output-dir dist

      - name: ✅ Validate Generated Assets
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          test -s dist/github-contribution-calendar.svg
          test -s dist/github-contribution-calendar-dark.svg
          test -s dist/github-streak.svg
          test -s dist/github-streak-dark.svg
          test -s dist/github-activity.svg
          test -s dist/github-activity-dark.svg
          grep -q "contributions in the last year" dist/github-contribution-calendar.svg
          grep -q "Contributions in the Last Year" dist/github-streak.svg
          find dist -maxdepth 1 -type f -printf "%f %s bytes\n" | sort

      - name: 🚀 Publish Contribution Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Update profile contribution assets"

          local_sha="$(git rev-parse HEAD)"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$remote_url" output:output
          remote_sha="$(git ls-remote "$remote_url" refs/heads/output | cut -f1)"

          test "$local_sha" = "$remote_sha"
          echo "Published and verified output commit: $remote_sha"
