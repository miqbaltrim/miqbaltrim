name: 📊 Generate Profile Contribution Assets

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-contribution-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate GitHub Contribution Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Profile Repository
        uses: actions/checkout@v7.0.1

      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate Synced Contribution Cards
        run: >-
          python .github/scripts/generate_profile_assets.py
          --user "${{ github.repository_owner }}"
          --output-dir dist

      - name: 🚀 Publish Contribution Assets
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
