name: 📊 Generate Profile Contribution Assets

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile-contribution-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate GitHub Contribution Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Profile Repository
        uses: actions/checkout@v7.0.1

      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate Synced Contribution Cards
        run: >-
          python .github/scripts/generate_profile_assets.py
          --user "${{ github.repository_owner }}"
          --output-dir dist

      - name: ✅ Validate Generated Assets
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          test -s dist/github-contribution-calendar.svg
          test -s dist/github-contribution-calendar-dark.svg
          test -s dist/github-streak.svg
          test -s dist/github-streak-dark.svg
          test -s dist/github-activity.svg
          test -s dist/github-activity-dark.svg
          grep -q "contributions in the last year" dist/github-contribution-calendar.svg
          grep -q "Contributions in the Last Year" dist/github-streak.svg
          find dist -maxdepth 1 -type f -printf "%f %s bytes\n" | sort

      - name: 🚀 Update Assets on Main Branch
        run: |
          mkdir -p assets
          cp dist/*.svg assets/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets

          if git diff --cached --quiet; then
            echo "Contribution assets are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile contribution assets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
